<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Service | AutoCare Garage</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="site-header">
        <div class="container nav-wrap">
            <span class="brand">AutoCare Garage</span>
            <nav>
                <a href="index.html">Home</a>
                <a href="service.html" class="active">Book a Service</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1 class="page-title">Vehicle Service Booking</h1>

        <!-- novalidate: validation is handled by js/script.js -->
        <form id="serviceForm" action="process_service.php" method="POST" novalidate>

            <fieldset>
                <legend>Customer Details</legend>

                <div class="field">
                    <label for="customerName">Customer name</label>
                    <input type="text" id="customerName" name="customerName">
                    <span class="error" id="customerNameError"></span>
                </div>

                <div class="field">
                    <label for="phone">Phone number (10 digits)</label>
                    <input type="tel" id="phone" name="phone" inputmode="numeric" placeholder="0712345678">
                    <span class="error" id="phoneError"></span>
                </div>

                <div class="field">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email">
                    <span class="error" id="emailError"></span>
                </div>
            </fieldset>

            <fieldset>
                <legend>Vehicle Details</legend>

                <div class="field">
                    <label for="regNumber">Vehicle registration number</label>
                    <input type="text" id="regNumber" name="regNumber" placeholder="e.g. KDA 123A">
                    <span class="error" id="regNumberError"></span>
                </div>

                <div class="field">
                    <label for="vehicleType">Vehicle type</label>
                    <select id="vehicleType" name="vehicleType">
                        <option value="">Select vehicle type</option>
                        <option value="Saloon Car">Saloon Car</option>
                        <option value="SUV">SUV</option>
                        <option value="Pickup">Pickup</option>
                        <option value="Van">Van</option>
                    </select>
                    <span class="error" id="vehicleTypeError"></span>
                </div>
                <p id="vehicleInfo" class="vehicle-info" aria-live="polite"></p>

                <div class="field">
                    <label for="vehicleModel">Vehicle model</label>
                    <input type="text" id="vehicleModel" name="vehicleModel" placeholder="e.g. Toyota Vitz">
                    <span class="error" id="vehicleModelError"></span>
                </div>

                <div class="field">
                    <label for="year">Year of manufacture</label>
                    <input type="number" id="year" name="year" min="1980" max="2026" value="2020">
                    <span class="error" id="yearError"></span>
                </div>
                <p id="ageWarning" class="warning" hidden></p>
            </fieldset>

            <fieldset>
                <legend>Booking</legend>

                <div class="field">
                    <label for="serviceDate">Preferred service date</label>
                    <input type="date" id="serviceDate" name="serviceDate">
                    <span class="error" id="serviceDateError"></span>
                </div>

                <div class="field">
                    <span class="field-label">Required services (select one or more)</span>
                    <label class="option">
                        <input type="checkbox" name="services[]" value="oil"> Engine Oil Change (KSh 3,000)
                    </label>
                    <label class="option">
                        <input type="checkbox" name="services[]" value="brake"> Brake Inspection (KSh 2,000)
                    </label>
                    <label class="option">
                        <input type="checkbox" name="services[]" value="alignment"> Wheel Alignment (KSh 2,500)
                    </label>
                    <label class="option">
                        <input type="checkbox" name="services[]" value="diagnosis"> Computer Diagnosis (KSh 3,500)
                    </label>
                    <label class="option">
                        <input type="checkbox" name="services[]" value="full"> Full Service (KSh 8,000)
                    </label>
                    <label class="option">
                        <input type="checkbox" name="services[]" value="tyre"> Tyre Balancing (KSh 2,000)
                    </label>
                    <span class="error" id="servicesError"></span>
                </div>
            </fieldset>

            <fieldset class="summary">
                <legend>Estimate</legend>
                <p><span id="serviceCount" class="service-count">0 services selected</span></p>
                <ul id="serviceList" class="breakdown"></ul>
                <p class="total">Estimated total: <span id="serviceTotal">KSh 0</span></p>
                <!-- Sent to PHP for comparison only; PHP recalculates the cost itself -->
                <input type="hidden" id="estimatedTotal" name="estimatedTotal" value="0">
            </fieldset>

            <button type="submit" class="btn">Submit Service Request</button>
        </form>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 AutoCare Garage. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
